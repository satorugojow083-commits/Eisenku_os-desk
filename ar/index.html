<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07070b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EISENKU AR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#07070b;--glass:rgba(13,13,20,.64);--line:rgba(255,255,255,.10);--txt:#ECEAF2;--mut:#9895A6;
  --pk:#FF4FA3;--gr:#3DFFA8;--r:14px;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--txt);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

#bg{position:fixed;inset:0;background:radial-gradient(1100px 760px at 72% -12%,rgba(255,79,163,.11),transparent 60%),radial-gradient(900px 700px at -5% 112%,rgba(61,255,168,.07),transparent 60%),var(--bg)}
#bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.032) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.032) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at center,#000 35%,transparent 85%);mask-image:radial-gradient(ellipse at center,#000 35%,transparent 85%)}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:0;transition:opacity .6s;filter:brightness(.78) saturate(.9)}
.cam-on #cam{opacity:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#desk{position:fixed;inset:0;z-index:10}

/* barra superior */
#bar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;padding-top:env(safe-area-inset-top);z-index:40;pointer-events:none}
#bar>*{pointer-events:auto}
.brand{font:600 12px/1 var(--mono);letter-spacing:.24em;display:flex;align-items:center;gap:10px;user-select:none}
.brand i{width:8px;height:8px;background:var(--pk);box-shadow:0 0 12px var(--pk);border-radius:2px}
.brand span{color:var(--mut)}
.chips{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip{font:11px/1 var(--mono);color:var(--mut);padding:9px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(10,10,16,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);white-space:nowrap}
.chip b{color:var(--gr);font-weight:500}
.tg{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:rgba(10,10,16,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--mut)}
.tg[aria-pressed=true]{border-color:rgba(61,255,168,.45);color:var(--gr)}

/* anillo HUD */
#ring{position:fixed;top:68px;right:18px;width:132px;height:132px;z-index:30;pointer-events:none}
#ring svg{position:absolute;inset:0;width:100%;height:100%}
#ring .spin{transform-origin:66px 66px;animation:spin 48s linear infinite}
#ring .rt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
#ring .rt b{font:500 25px/1 var(--mono)}
#ring .rt small{font:9.5px/1.8 var(--mono);color:var(--mut);letter-spacing:.18em;text-transform:uppercase}
#ring .rt em{font:500 11px/1.4 var(--mono);color:var(--pk);font-style:normal}
@keyframes spin{to{transform:rotate(360deg)}}

/* ventanas */
.win{position:absolute;display:flex;flex-direction:column;min-width:220px;min-height:140px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 26px 70px -22px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.06);transform:perspective(1000px) rotateY(var(--ry,0deg)) rotate(var(--r,0deg)) scale(var(--s,1));animation:pop .22s cubic-bezier(.2,.8,.2,1)}
.win.focus{border-color:rgba(255,79,163,.34)}
.win.settle{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.win.closing{opacity:0;transition:opacity .16s}
@keyframes pop{from{opacity:0;transform:perspective(1000px) scale(calc(var(--s,1)*.95))}}
.win-head{flex:none;height:40px;display:flex;align-items:center;gap:4px;padding:0 6px 0 14px;border-bottom:1px solid var(--line);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.win-head .t{font:500 10.5px/1 var(--mono);letter-spacing:.17em;text-transform:uppercase;color:var(--mut);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-head .t::before{content:"";display:inline-block;width:6px;height:6px;margin-right:10px;background:var(--pk);border-radius:1px;vertical-align:1px}
.win.focus .win-head .t{color:var(--txt)}
.ib{width:32px;height:32px;display:grid;place-items:center;border:0;background:transparent;border-radius:8px;color:var(--mut)}
.ib:hover{background:rgba(255,255,255,.07);color:var(--txt)}
.win-body{flex:1;min-height:0;padding:14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.win-resize{position:absolute;right:0;bottom:0;width:26px;height:26px;cursor:nwse-resize;touch-action:none;z-index:3}
.win-resize::after{content:"";position:absolute;right:7px;bottom:7px;width:8px;height:8px;border-right:1.5px solid var(--mut);border-bottom:1.5px solid var(--mut);opacity:.55}
.win.bare{background:transparent;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.win.bare .win-head{position:absolute;top:8px;right:8px;height:auto;border:0;padding:0;opacity:0;transition:opacity .2s;z-index:2;background:rgba(10,10,16,.7);border-radius:9px}
.win.bare:hover .win-head,.win.bare.focus .win-head{opacity:1}
.win.bare .win-head .t{display:none}
.win.bare .win-body{padding:0;overflow:hidden;touch-action:none;cursor:grab}
.photo{width:100%;height:100%;object-fit:cover;border-radius:12px;border:1px solid rgba(255,255,255,.2);box-shadow:0 30px 80px -24px rgba(0,0,0,.85);pointer-events:none;user-select:none;display:block}

/* controles */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.08)}
.btn.pri{background:var(--pk);border-color:transparent;color:#17060f;font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sq{width:36px;padding:0}
input:not([type]),input[type=text],input[type=number],textarea{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none;min-width:0}
input:focus,textarea:focus{border-color:rgba(61,255,168,.5)}
textarea{resize:none}
.muted{color:var(--mut)}.sm{font-size:12px}
.lbl{font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.scroll{overflow:auto;min-height:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:12px;color:var(--mut)}
.seg button.on{background:rgba(255,255,255,.08);color:var(--txt)}
.hh{outline:2px solid var(--gr)!important;outline-offset:2px}
.press{animation:press .22s}
@keyframes press{50%{transform:scale(.93)}}

/* dock */
#dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:18px;background:rgba(10,10,16,.62);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);z-index:40;max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
#dock button{position:relative;flex:none;width:58px;height:58px;border:0;border-radius:13px;background:transparent;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:9px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
#dock button svg{width:21px;height:21px}
#dock button:hover{background:rgba(255,255,255,.06);color:var(--txt)}
#dock button.on{color:var(--txt)}
#dock button.on::after{content:"";position:absolute;bottom:3px;width:14px;height:2px;border-radius:2px;background:var(--pk)}

/* menu radial (palma abierta) */
#radial{position:fixed;inset:0;z-index:55;pointer-events:none}
#radial button{position:absolute;width:64px;height:64px;margin:-32px;border-radius:50%;border:1px solid rgba(255,79,163,.4);background:rgba(10,10,16,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--txt);display:grid;place-items:center;pointer-events:auto;opacity:0;transform:scale(.5);transition:transform .26s cubic-bezier(.2,.9,.3,1.25),opacity .18s}
#radial.on button{opacity:1;transform:none}
#radial button span{position:absolute;top:calc(100% + 5px);font:9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
#radial button svg{width:22px;height:22px}

/* arranque */
#boot{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(7,7,11,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:opacity .45s}
#boot.out{opacity:0;pointer-events:none}
.boot{width:min(420px,calc(100vw - 32px));text-align:center}
.boot h1{font:600 13px var(--mono);letter-spacing:.46em;margin:24px 0 8px;padding-left:.46em}
.boot p{color:var(--mut);margin:0 0 28px}
.boot .btns{display:grid;gap:10px}
.boot .btn{height:48px;font-size:14px}
.boot small{display:block;margin-top:20px;color:var(--mut);font-size:12px;line-height:1.5}
.mark{width:84px;height:84px;margin:auto}

/* escenas a pantalla completa */
#scene{position:fixed;inset:0;z-index:150;background:#07070b;display:none;overflow:hidden}
#scene.on{display:block}
#scene>.x{position:absolute;top:16px;right:16px;z-index:5}
.st{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.st-grid{position:absolute;inset:-50%;background-image:linear-gradient(rgba(255,79,163,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,79,163,.09) 1px,transparent 1px);background-size:64px 64px;transform:perspective(600px) rotateX(62deg);animation:grid 6s linear infinite}
@keyframes grid{to{background-position:0 64px}}
.st-c{position:relative;padding:24px}
.st-k{font:500 12px var(--mono);letter-spacing:.4em;color:var(--pk)}
.st h1{font:700 clamp(34px,7vw,96px)/1 var(--sans);letter-spacing:-.02em;margin:18px 0}
.st-cd{font:500 clamp(40px,9vw,120px)/1 var(--mono);color:var(--gr);text-shadow:0 0 40px rgba(61,255,168,.35)}
.st p{color:var(--mut);font-size:clamp(14px,1.6vw,20px);margin:18px 0 0}
.st-goal{margin:34px auto 0;width:min(520px,80vw);text-align:left}
.st-goal .bar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
.st-goal .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pk),var(--gr));border-radius:8px}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:8vh 9vw}
.sl h2{font:700 clamp(30px,5.4vw,76px)/1.05 var(--sans);letter-spacing:-.02em;margin:0 0 4vh;max-width:18ch}
.sl h2::before{content:"";display:block;width:56px;height:4px;background:var(--pk);margin-bottom:3vh;border-radius:2px}
.sl ul{margin:0;padding:0;list-style:none;font-size:clamp(18px,2.4vw,34px);line-height:1.5}
.sl li{padding-left:1.2em;position:relative}
.sl li::before{content:"";position:absolute;left:0;top:.62em;width:.42em;height:.42em;border-radius:2px;background:var(--gr)}
.sl p{font-size:clamp(17px,2.2vw,30px);color:#cfccd9;margin:0 0 1em;max-width:40ch}
.sl-nav{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:14px;z-index:4}
.sl-nav .lbl{min-width:64px;text-align:center}
.sl-in{animation:slin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slin{from{opacity:0;transform:translateY(14px)}}

/* apps */
.n-wrap{display:grid;grid-template-columns:minmax(130px,34%) 1fr;gap:10px;flex:1;min-height:0}
.n-side{display:flex;flex-direction:column;gap:8px;min-height:0}
.n-list{display:flex;flex-direction:column;gap:2px;flex:1}
.n-item{text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-item.on{background:rgba(255,255,255,.07);color:var(--txt)}
.n-ed{flex:1;min-height:0;font-size:14px;line-height:1.6}
.t-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;flex:1}
.t-list li{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 10px;border-radius:9px}
.t-list li:hover{background:rgba(255,255,255,.04)}
.t-list label{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.t-list input{width:18px;height:18px;accent-color:var(--gr);flex:none}
.t-list .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.t-list .done .tx{color:var(--mut);text-decoration:line-through}
.tag{font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:6px;border:1px solid rgba(255,79,163,.35);color:#ffb3d6;white-space:nowrap}
.mat{width:120px}
.empty{margin:auto;text-align:center;color:var(--mut);font-size:13px;max-width:30ch}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.g-th{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;background:#000}
.g-th img{width:100%;height:100%;object-fit:cover;display:block}
.orb{width:120px;height:120px;border-radius:50%;margin:6px auto 0;border:1px solid rgba(255,79,163,.4);background:radial-gradient(circle at 50% 40%,rgba(255,79,163,.22),rgba(10,10,16,.6) 70%);display:grid;place-items:center;color:var(--txt);position:relative}
.orb svg{width:34px;height:34px}
.orb.on{border-color:var(--gr);box-shadow:0 0 0 0 rgba(61,255,168,.5);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 22px rgba(61,255,168,0)}100%{box-shadow:0 0 0 0 rgba(61,255,168,0)}}
.v-st{text-align:center;color:var(--mut);font-size:13px;min-height:20px}
.v-log{flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px}
.v-log div{padding:7px 10px;border-radius:9px;background:rgba(255,255,255,.04);max-width:88%}
.v-log .you{align-self:flex-end;background:rgba(255,79,163,.14)}
.v-help summary{cursor:pointer;color:var(--mut);font-size:12px}
.v-help ul{margin:8px 0 0;padding-left:18px;color:var(--mut);font-size:12px}
.clk{text-align:center;padding:6px 0 2px}
.clk b{font:500 46px/1 var(--mono);letter-spacing:.02em}
.clk b span{font-size:20px;color:var(--mut)}
.clk div{color:var(--mut);font-size:12px;margin-top:6px}
.tm{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.tm>svg{width:110px;height:110px}
.tm .big{font:500 28px/1 var(--mono)}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.links a{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.03);text-decoration:none;color:var(--txt);font-size:13px}
.links a small{color:var(--mut);font:10px var(--mono);letter-spacing:.06em}
.links a:hover{border-color:rgba(255,79,163,.4)}
.gm{position:relative;flex:1;min-height:0;border-radius:0 0 var(--r) var(--r);overflow:hidden;touch-action:none}
.gm canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.gm-ui{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:10px;background:rgba(7,7,11,.55)}
.gm-ui h3{margin:0;font:600 12px var(--mono);letter-spacing:.3em}
.field{display:grid;gap:6px}
.goal{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center}

#toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,10px);opacity:0;z-index:210;padding:10px 16px;border-radius:10px;background:rgba(20,20,30,.94);border:1px solid var(--line);font-size:13px;transition:.25s;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:640px){#ring{display:none}.chip.fps{display:none}.n-wrap{grid-template-columns:1fr}.n-side{max-height:120px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg"></div>
<video id="cam" playsinline muted></video>
<div id="desk"></div>
<canvas id="fx"></canvas>

<header id="bar">
  <div class="brand"><i></i>EISENKU<span>/ AR</span></div>
  <div class="chips">
    <div class="chip" id="stHands">MANOS <b>—</b></div>
    <div class="chip fps" id="stFps">— FPS</div>
    <button class="tg" id="tgCam" aria-pressed="false" title="Cámara"></button>
    <button class="tg" id="tgSkel" aria-pressed="true" title="Ver esqueleto de manos"></button>
    <button class="tg" id="tgFull" aria-pressed="false" title="Pantalla completa"></button>
  </div>
</header>

<div id="ring" aria-hidden="true">
  <svg viewBox="0 0 132 132">
    <circle cx="66" cy="66" r="62" fill="none" stroke="rgba(255,255,255,.08)"/>
    <g class="spin"><circle cx="66" cy="66" r="62" fill="none" stroke="#FF4FA3" stroke-width="1.5" stroke-dasharray="2 10 40 10" opacity=".8"/></g>
    <circle cx="66" cy="66" r="52" fill="none" stroke="rgba(61,255,168,.25)" stroke-dasharray="1 5"/>
    <circle id="ringT" cx="66" cy="66" r="56" fill="none" stroke="#3DFFA8" stroke-width="2" stroke-linecap="round" transform="rotate(-90 66 66)" stroke-dasharray="0 400"/>
  </svg>
  <div class="rt"><small id="ringD">—</small><b id="ringC">--:--</b><em id="ringE"></em></div>
</div>

<nav id="dock" aria-label="Apps"></nav>
<div id="radial"></div>
<div id="scene"></div>
<div id="toast" role="status"></div>

<div id="boot">
  <div class="boot">
    <svg class="mark" viewBox="0 0 84 84" aria-hidden="true">
      <circle cx="42" cy="42" r="38" fill="none" stroke="rgba(255,255,255,.1)"/>
      <circle cx="42" cy="42" r="38" fill="none" stroke="#FF4FA3" stroke-width="2" stroke-dasharray="60 180" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 42 42" to="360 42 42" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="42" cy="42" r="26" fill="none" stroke="rgba(61,255,168,.5)" stroke-dasharray="2 6"/>
      <rect x="37" y="37" width="10" height="10" rx="2" fill="#FF4FA3"/>
    </svg>
    <h1>EISENKU AR</h1>
    <p>Controla tus ventanas con las manos, la voz o el tacto.</p>
    <div class="btns">
      <button class="btn pri" id="goCam">Iniciar con cámara</button>
      <button class="btn" id="goTouch">Usar solo táctil</button>
    </div>
    <small id="bootMsg">La cámara se procesa en tu dispositivo. No se envía nada a internet.</small>
  </div>
</div>

<script type="module">
/* ───────── utilidades ───────── */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'value' || k === 'checked') e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem('eku.' + k)); return v ?? d; } catch { return d; } },

let Z = 20;

function geom(el) { return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight, s: num(el, '--s', 1), r: num(el, '--r', 0) }; }
function saveLayout() {
  const o = { ...layout };
  WINS.forEach((w, id) => { if (!id.startsWith('img-')) o[id] = geom(w.el); });
  Object.assign(layout, o);
  store.set('layout', o);
  store.set('open', [...WINS.keys()].filter(i => !i.startsWith('img-')));

function focusWin(el) {
  if (el.classList.contains('focus')) { el.style.zIndex = ++Z; return; }
  desk.querySelectorAll('.win.focus').forEach(e => e.classList.remove('focus'));
  el.classList.add('focus'); el.style.zIndex = ++Z;
}
function applyGeom(el, mode, st, dx, dy) {
  if (mode === 'move') {
    el.style.left = clamp(st.l + dx, 60 - el.offsetWidth, innerWidth - 60) + 'px';
    el.style.top = clamp(st.t + dy, 0, innerHeight - 48) + 'px';
  } else {
    el.style.width = Math.max(220, st.w + dx) + 'px';
    el.style.height = Math.max(140, st.h + dy) + 'px';

}
function bindPointer(handle, el, mode) {
  handle.addEventListener('pointerdown', e => {
    if (mode === 'move' && e.target.closest('button,input,textarea,a')) return;
    if (e.button > 0) return;
    e.preventDefault(); focusWin(el); el.classList.remove('settle');
    handle.setPointerCapture(e.pointerId);
    const st = { x: e.clientX, y: e.clientY, l: el.offsetLeft, t: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
    const mv = ev => applyGeom(el, mode, st, ev.clientX - st.x, ev.clientY - st.y);
    const up = () => { handle.removeEventListener('pointermove', mv); handle.removeEventListener('pointerup', up); handle.removeEventListener('pointercancel', up); saveLayout(); };
    handle.addEventListener('pointermove', mv); handle.addEventListener('pointerup', up); handle.addEventListener('pointercancel', up);
  });
}
function createWin(id, { title, w = 380, h: ht = 320, bare = false }) {

/* ───────── temporizador global ───────── */
const Timer = {
  total: 300, left: 300, run: false, end: 0, subs: new Set(),
  set(s) { this.total = this.left = s; this.run = false; this.emit(); },
  start() { if (this.left <= 0) this.left = this.total; this.end = performance.now() + this.left * 1000; this.run = true; this.emit(); },
  pause() { this.tick(); this.run = false; this.emit(); },
  reset() { this.run = false; this.left = this.total; this.emit(); },
  tick() {
    if (!this.run) return;
    this.left = Math.max(0, (this.end - performance.now()) / 1000);
    if (this.left <= 0) { this.run = false; ding(); speak('Se acabó el tiempo.'); toast('Tiempo terminado'); }
    this.emit();
  },
  emit() { this.subs.forEach(f => f(this)); },
};
setInterval(() => Timer.tick(), 250);

function parseSlides(src) {
  const slides = []; let cur = null;
  for (const raw of src.split('\n')) {
    const l = raw.trim(); if (!l) continue;
    if (l.startsWith('# ')) { cur = { t: l.slice(2), b: [] }; slides.push(cur); continue; }
    if (!cur) { cur = { t: '', b: [] }; slides.push(cur); }
    cur.b.push(l.startsWith('- ') ? { li: l.slice(2) } : { p: l });
  }
  return slides;
}
function present(src) {
  const slides = parseSlides(src); if (!slides.length) { toast('Escribe al menos una diapositiva con "# Título"'); return; }
  let i = 0;
  const stage = h('div', {}), count = h('span', { class: 'lbl' });
  const render = () => {
    const s = slides[i]; const items = []; let ul = null;
    for (const b of s.b) {
      if (b.li) { if (!ul) { ul = h('ul'); items.push(ul); } ul.append(h('li', {}, b.li)); }
      else { ul = null; items.push(h('p', {}, b.p)); }
    }
    stage.replaceChildren(h('div', { class: 'sl sl-in' }, s.t ? h('h2', {}, s.t) : null, items));
    count.textContent = `${i + 1} / ${slides.length}`;
  };
  const go = d => { i = clamp(i + d, 0, slides.length - 1); render(); };
  const key = e => { if (['ArrowRight', 'PageDown', ' '].includes(e.key)) go(1); if (['ArrowLeft', 'PageUp'].includes(e.key)) go(-1); };
  let sx = null;
  const node = h('div', {
    style: 'position:absolute;inset:0',
    onpointerdown: e => { sx = e.clientX; },
    onpointerup: e => { if (sx != null && Math.abs(e.clientX - sx) > 60) go(e.clientX < sx ? 1 : -1); sx = null; },
  }, stage, h('div', { class: 'sl-nav' },
    h('button', { class: 'btn sq', onclick: () => go(-1), title: 'Anterior' }, icon('left')), count,
    h('button', { class: 'btn sq', onclick: () => go(1), title: 'Siguiente' }, icon('right'))));
  addEventListener('keydown', key); render();
  openScene(node, () => removeEventListener('keydown', key));
}

function runCommand(raw) {
  const t = norm(raw).replace(/^(oye |ok )?(eisen\w*)\s*/, '');
  if (/(cierra|cerrar) todo/.test(t)) { [...WINS.keys()].forEach(closeWin); return 'Listo, cerré todo.'; }
  let m = t.match(/^(abre|abrir|muestra|mostrar|cierra|cerrar)\s+(?:el |la |los |las |mi |mis )?(\w+)/);
  if (m) {
    const id = ALIAS[m[2]]; if (!id) return `No conozco la app ${m[2]}.`;
    if (m[1].startsWith('c')) { closeWin(id); return `Cerré ${APPS[id].title}.`; }
    openApp(id); return `Abriendo ${APPS[id].title}.`;
  }
  m = raw.match(/(?:anota|apunta|nota)\s+(?:que\s+)?(.+)/i);
  if (m && /^(\s*(oye |ok )?(eisen\w*)?\s*)(anota|apunta|nota)\b/i.test(norm(raw))) { addNote(m[1].trim()); return 'Anotado.'; }
  m = t.match(/(\d+|[a-z]+)\s+minutos?/);
  if (m && /temporizador|alarma|avisame|cuenta|timer/.test(t)) {
    const n = +m[1] || NUM[m[1]];
    if (n) { openApp('reloj'); Timer.set(n * 60); Timer.start(); return `Temporizador de ${n} minuto${n > 1 ? 's' : ''} en marcha.`; }
  }
  if (/hora/.test(t)) return 'Son las ' + new Date().toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' }) + '.';
  if (/fecha|que dia/.test(t)) return 'Hoy es ' + new Date().toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' }) + '.';
  if (/empezamos pronto|modo stream|escena/.test(t)) { launchStream(); return 'Escena lanzada.'; }
  if (/^presenta|presentar|inicia la exposicion/.test(t)) { present(store.get('expo', '')); return 'Iniciando presentación.'; }
  if (/salir|termina/.test(t)) { closeScene(); return 'Hecho.'; }
  return 'No entendí. Prueba con “abre notas” o “qué hora es”.';
}

  if (c) {
    press(c);
    if (c.matches('textarea,input:not([type]),input[type=text],input[type=number]')) c.focus(); else c.click();
    s.mode = 'click'; return;
  }
  if (t.closest('canvas[data-touch]')) { s.mode = 'game'; return; }
  if (win && (t.closest('.win-head') || t.closest('[data-grab]'))) { s.mode = 'move'; s.win = win; s.st = { x: s.x, y: s.y, l: win.offsetLeft, t: win.offsetTop }; win.classList.remove('settle'); return; }
  const sc = t.closest('.scroll') || t.closest('.win-body');
  if (sc) { s.mode = 'scroll'; s.sc = sc; s.ly = s.y; s.win = win; }
}
function pinchMove(s) {
  if (s.mode === 'move') {
    applyGeom(s.win, 'move', s.st, s.x - s.st.x, s.y - s.st.y);
    s.win.style.setProperty('--ry', clamp(s.vx * 1.6, -26, 26).toFixed(1) + 'deg');
  } else if (s.mode === 'resize') applyGeom(s.win, 'resize', s.st, s.x - s.st.x, s.y - s.st.y);
  else if (s.mode === 'scroll') { s.sc.scrollTop -= (s.y - s.ly) * 1.5; s.ly = s.y; }
}
function pinchEnd(s) {
  if (s.mode === 'xf' && xf) { const o = xf.a === s ? xf.b : xf.a; o.mode = null; o.win = null; xf = null; saveLayout(); }
  if ((s.mode === 'move' || s.mode === 'resize') && s.win) { s.win.classList.add('settle'); s.win.style.setProperty('--ry', '0deg'); saveLayout(); }
  s.mode = null; s.win = null;
}

function draw() {
  const dpr = Math.min(2, devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  if (fx.width !== Math.round(W * dpr) || fx.height !== Math.round(H * dpr)) { fx.width = Math.round(W * dpr); fx.height = Math.round(H * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  for (const s of S) {
    if (!s.vis) continue;
    if (skel) {
      const P = s.lm.map(toScreen);
      ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1.2; ctx.beginPath();
      for (const [i, j] of CONN) { ctx.moveTo(P[i].x, P[i].y); ctx.lineTo(P[j].x, P[j].y); }
      ctx.stroke(); ctx.fillStyle = 'rgba(255,255,255,.75)';
      for (const p of P) ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
    }
    const col = s.pinch ? '#FF4FA3' : '#3DFFA8';
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(s.x, s.y, s.pinch ? 10 : 17, 0, TAU); ctx.stroke();
    if (s.pinch) { ctx.fillStyle = 'rgba(255,79,163,.35)'; ctx.fill(); }
    ctx.fillStyle = col; ctx.fillRect(s.x - 1.5, s.y - 1.5, 3, 3);
    if (s.palmP > .05) { ctx.strokeStyle = '#FF4FA3'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(s.x, s.y, 30, -Math.PI / 2, -Math.PI / 2 + TAU * s.palmP); ctx.stroke(); }
  }
}

/* ───────── arranque ───────── */
const boot = $('#boot');
const enter = () => boot.classList.add('out');
$('#goTouch').onclick = enter;
$('#goCam').onclick = async () => {
  $('#bootMsg').textContent = 'Abriendo cámara…';
  const ok = await startTracking();
  enter();
  if (!ok) $('#bootMsg').textContent = 'La cámara se procesa en tu dispositivo. No se envía nada a internet.';
};
const saved = store.get('open', null);
(saved ?? ['notas', 'reloj']).forEach(openApp);

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
